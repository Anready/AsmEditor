name: build

# Not on every push: run it by hand (Actions → build → Run workflow); pull requests are still checked.
# Releases are built by release.yml when a v* tag is pushed.
on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and Inno Setup
        shell: pwsh
        run: |
          choco install nasm innosetup -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build, unit tests, UI test
        shell: cmd
        run: build.bat test uitest

      - name: Portable zip and installer
        shell: cmd
        run: build.bat nobuild package installer

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test
          path: out/uitest/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: AsmEditor
          path: |
            AsmEditor.exe
            AsmEditor-portable.zip
            out/installer/*.exe

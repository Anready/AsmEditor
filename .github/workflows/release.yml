name: release

# Push a tag v<major>.<minor>.<patch> (the numbers of src/version.h) to build, test, sign (when the signing
# secrets are set) and publish a GitHub release with the portable zip and the installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      # Or SignPath (free for open source through the SignPath Foundation; see packaging/README.md).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $text = Select-String -Path src/version.h -Pattern 'ASMEDITOR_VERSION_TEXT "([^"]+)"'
          $version = $text.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag does not match src/version.h ($version)" }
          "ASMEDITOR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The release notes: the "## <version>" section of CHANGELOG.md.
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $version" }
          $section.Groups[1].Value.Trim() | Out-File -FilePath "$env:RUNNER_TEMP\notes.md" -Encoding utf8

      - name: Install NASM and Inno Setup
        shell: pwsh
        run: |
          choco install nasm innosetup -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build, unit tests, UI test
        shell: cmd
        run: build.bat test uitest

      # Optional code signing: SIGNING_CERT = base64 of a .pfx, SIGNING_PASSWORD = its password.
      - name: Sign AsmEditor.exe
        if: ${{ env.SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 AsmEditor.exe
          if ($LASTEXITCODE) { throw "signtool failed" }

      - name: Upload AsmEditor.exe for SignPath
        id: unsigned-exe
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: AsmEditor.exe

      - name: Sign AsmEditor.exe (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: AsmEditor
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Use the signed AsmEditor.exe
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-exe\AsmEditor.exe AsmEditor.exe -Force

      - name: Portable zip and installer
        shell: cmd
        run: build.bat nobuild package installer

      - name: Upload the installer for SignPath
        id: unsigned-setup
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: out/installer/*.exe

      - name: Sign the installer (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: AsmEditor
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-setup\*.exe out\installer\ -Force

      - name: Sign the installer
        if: ${{ env.SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem out\installer\*.exe).FullName
          if ($LASTEXITCODE) { throw "signtool failed" }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # AsmEditor.exe on its own: what a portable copy downloads when it updates itself (Help → Update AsmEditor)
          $files = @("AsmEditor.exe", "AsmEditor-portable.zip") + (Get-ChildItem out\installer\*.exe).FullName
          gh release create "${{ github.ref_name }}" $files --title "AsmEditor ${{ env.ASMEDITOR_VERSION }}" --notes-file "$env:RUNNER_TEMP\notes.md"
